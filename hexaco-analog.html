<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HA-60 · HEXACO-Model Personality Inventory (Unofficial Analog)</title>
<style>
  :root {
    color-scheme: light;
    --page:       #f9f9f7;
    --surface:    #fcfcfb;
    --ink:        #0b0b0b;
    --ink-2:      #52514e;
    --muted:      #898781;
    --grid:       #e1e0d9;
    --baseline:   #c3c2b7;
    --border:     rgba(11,11,11,0.10);
    --accent:     #2a78d6;
    --accent-soft:#cde2fb;
    --accent-wash:rgba(42,120,214,0.10);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --page:       #0d0d0d;
      --surface:    #1a1a19;
      --ink:        #ffffff;
      --ink-2:      #c3c2b7;
      --muted:      #898781;
      --grid:       #2c2c2a;
      --baseline:   #383835;
      --border:     rgba(255,255,255,0.10);
      --accent:     #3987e5;
      --accent-soft:#184f95;
      --accent-wash:rgba(57,135,229,0.14);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 24px 16px 64px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 16px;
  }
  h1 { font-size: 24px; line-height: 1.25; margin: 0 0 4px; }
  h2 { font-size: 18px; margin: 0 0 8px; }
  .sub { color: var(--ink-2); font-size: 14px; margin: 0 0 16px; }
  .disclaimer { color: var(--muted); font-size: 12.5px; line-height: 1.5; }
  .btn {
    appearance: none; border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface); color: var(--ink);
    font: 600 15px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 12px 20px; cursor: pointer;
  }
  .btn:hover { background: var(--accent-wash); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { filter: brightness(1.07); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btnrow { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  input[type=text] {
    background: var(--surface); color: var(--ink);
    border: 1px solid var(--baseline); border-radius: 8px;
    padding: 10px 12px; font: inherit; width: 100%; max-width: 320px;
  }

  /* progress */
  .progress { position: sticky; top: 0; z-index: 5; background: var(--page); padding: 10px 0 12px; }
  .progress .meta { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-2); margin-bottom: 6px; }
  .track { background: var(--accent-soft); border-radius: 4px; height: 8px; overflow: hidden; }
  .track .fill { background: var(--accent); height: 100%; border-radius: 0 4px 4px 0; transition: width .2s; }

  /* items */
  fieldset.item { border: 0; border-top: 1px solid var(--grid); margin: 0; padding: 18px 0; }
  fieldset.item:first-of-type { border-top: 0; }
  fieldset.item legend { font-size: 16px; font-weight: 600; padding: 0 0 10px; float: left; width: 100%; }
  fieldset.item legend .qnum { color: var(--muted); font-weight: 600; margin-right: 6px; }
  fieldset.item.missing legend { color: #d03b3b; }
  .opts { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; clear: both; }
  .opts label {
    display: flex; align-items: center; justify-content: center; text-align: center;
    border: 1px solid var(--baseline); border-radius: 8px;
    padding: 10px 6px; font-size: 12.5px; line-height: 1.25; color: var(--ink-2);
    cursor: pointer; user-select: none; min-height: 52px;
  }
  .opts label:hover { background: var(--accent-wash); }
  .opts input { position: absolute; opacity: 0; pointer-events: none; }
  .opts label:has(input:checked) {
    background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600;
  }
  .opts label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (max-width: 560px) {
    .opts { grid-template-columns: 1fr; }
    .opts label { min-height: 0; justify-content: flex-start; padding: 8px 12px; }
  }

  /* results */
  .results-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 720px) { .results-grid { grid-template-columns: 1fr; } }
  .radar-card { display: flex; flex-direction: column; align-items: center; }
  .radar-card svg { max-width: 100%; height: auto; }
  .score-list { display: flex; flex-direction: column; gap: 12px; justify-content: center; }
  .score-row { display: grid; grid-template-columns: 160px 1fr 44px; align-items: center; gap: 10px; }
  .score-row .name { font-size: 14px; font-weight: 600; }
  .score-row .band { display: block; font-size: 11.5px; font-weight: 400; color: var(--muted); }
  .score-row .bar { background: var(--accent-soft); height: 14px; border-radius: 4px; position: relative; }
  .score-row .bar .fill { background: var(--accent); height: 100%; border-radius: 0 4px 4px 0; }
  .score-row .val { font-size: 14px; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
  .factor-card h2 { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .factor-card h2 .fscore { font-size: 15px; color: var(--ink-2); font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .factor-card p { font-size: 14px; color: var(--ink-2); margin: 4px 0 14px; }
  .facet-row { display: grid; grid-template-columns: 150px 1fr 36px; align-items: center; gap: 10px; padding: 5px 4px; border-radius: 6px; }
  .facet-row:hover { background: var(--accent-wash); }
  .facet-row .fname { font-size: 13px; color: var(--ink-2); }
  .facet-row .bar { background: var(--accent-soft); height: 10px; border-radius: 3px; }
  .facet-row .bar .fill { background: var(--accent); height: 100%; border-radius: 0 3px 3px 0; }
  .facet-row .fval { font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; color: var(--ink); }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
"use strict";

/* ============================================================
   HA-60 — an unofficial, original-item analog of the HEXACO
   model of personality structure. Not the HEXACO-PI-R.
   Scores are raw item means (1–5) with no population norms.
   ============================================================ */

const SCALE = [
  [1, "Strongly disagree"],
  [2, "Disagree"],
  [3, "Neutral"],
  [4, "Agree"],
  [5, "Strongly agree"],
];

const FACTORS = {
  H: { name: "Honesty-Humility",
       facets: ["Sincerity", "Fairness", "Greed Avoidance", "Modesty"],
       high: "Your responses suggest you lean toward sincerity, fairness, and modesty, with little appetite for flattery, special status, or material one-upmanship.",
       mid:  "You balance honest dealing with a healthy dose of self-interest — neither saintly nor scheming.",
       low:  "Your responses suggest a pragmatic, self-promoting style: comfort with flattery or rule-bending when it pays, and a taste for status and material success." },
  E: { name: "Emotionality",
       facets: ["Fearfulness", "Anxiety", "Dependence", "Sentimentality"],
       high: "You tend to feel things strongly — alert to danger, prone to worry, close to others in times of stress, and easily moved.",
       mid:  "You feel and manage emotion in roughly equal measure — concerned when it matters, steady when it doesn't.",
       low:  "You tend to be emotionally steady and self-contained: little fear of physical harm, calm under pressure, and not much need for reassurance." },
  X: { name: "eXtraversion",
       facets: ["Social Self-Esteem", "Social Boldness", "Sociability", "Liveliness"],
       high: "You draw energy from people: socially confident, comfortable speaking up or taking the lead, and typically upbeat.",
       mid:  "You move comfortably between social energy and quiet time, depending on the situation.",
       low:  "You lean reserved: quieter in groups, content with solitude, and less driven by social stimulation." },
  A: { name: "Agreeableness",
       facets: ["Forgivingness", "Gentleness", "Flexibility", "Patience"],
       high: "You tend to forgive, judge gently, compromise readily, and keep your temper even when provoked.",
       mid:  "You cooperate readily but push back when it counts — neither a pushover nor a fighter.",
       low:  "You hold your ground: slow to forgive, quick to critique, firm in disagreements, and easily irritated by unfair treatment." },
  C: { name: "Conscientiousness",
       facets: ["Organization", "Diligence", "Perfectionism", "Prudence"],
       high: "You work in an organized, disciplined way: careful with details, deliberate in decisions, and demanding of your own effort.",
       mid:  "You are organized where it matters and relaxed where it doesn't.",
       low:  "You take a loose, improvised approach: comfortable with clutter and imperfection, guided more by impulse than by plans." },
  O: { name: "Openness to Experience",
       facets: ["Aesthetic Appreciation", "Inquisitiveness", "Creativity", "Unconventionality"],
       high: "You are drawn to ideas, art, and the unusual: curious, imaginative, and energized by unconventional thinking.",
       mid:  "You mix curiosity with practicality — open to new ideas that earn their keep.",
       low:  "You prefer the practical and familiar: less drawn to art or abstract ideas, more to what is proven and useful." },
};
const FACTOR_KEYS = ["H", "E", "X", "A", "C", "O"];

/* Original items. f = factor, fc = facet index within the factor, r = reverse-keyed. */
const BANK = {
  H: [
    { t: "If flattering someone would get me what I want, I'd probably do it.", fc: 0, r: true },
    { t: "I say what I actually think, even when it isn't the flattering thing to say.", fc: 0, r: false },
    { t: "I sometimes act friendlier than I feel so that people will do favors for me.", fc: 0, r: true },
    { t: "I would keep money I found if I were certain no one could ever find out.", fc: 1, r: true },
    { t: "I wouldn't cheat on my taxes even if I were sure I'd get away with it.", fc: 1, r: false },
    { t: "Bending the rules for personal profit is fine as long as nobody gets hurt.", fc: 1, r: true },
    { t: "Owning expensive, high-status things matters a lot to me.", fc: 2, r: true },
    { t: "I'm content with what I have and rarely long for luxury.", fc: 2, r: false },
    { t: "Frankly, I deserve more respect than the average person does.", fc: 3, r: true },
    { t: "I don't think of myself as better than other people.", fc: 3, r: false },
  ],
  E: [
    { t: "I avoid physical risks, even small ones, whenever I can.", fc: 0, r: false },
    { t: "The prospect of physical danger doesn't frighten me much.", fc: 0, r: true },
    { t: "I keep worrying about small problems long after other people have let them go.", fc: 1, r: false },
    { t: "I stay calm even when a great deal is riding on the outcome.", fc: 1, r: true },
    { t: "When things go wrong, I have a hard time stopping myself from stressing about them.", fc: 1, r: false },
    { t: "When I face a hard decision, I need to talk it through with someone I trust.", fc: 2, r: false },
    { t: "I prefer to handle my difficulties without leaning on anyone.", fc: 2, r: true },
    { t: "Saying goodbye to people I care about really gets to me.", fc: 3, r: false },
    { t: "I rarely get emotional, even at farewells or reunions.", fc: 3, r: true },
    { t: "I feel other people's sadness almost as if it were my own.", fc: 3, r: false },
  ],
  X: [
    { t: "In groups, I generally feel that people are glad I'm there.", fc: 0, r: false },
    { t: "I often feel like the least interesting person in the room.", fc: 0, r: true },
    { t: "Speaking in front of a group doesn't bother me.", fc: 1, r: false },
    { t: "In meetings I'd rather stay quiet than risk saying something wrong.", fc: 1, r: true },
    { t: "I'm usually the one who introduces myself first to strangers.", fc: 1, r: false },
    { t: "A day full of people energizes me more than a day alone.", fc: 2, r: false },
    { t: "Given the choice, I'd rather spend the evening by myself than at a lively gathering.", fc: 2, r: true },
    { t: "I like having lots of people around me.", fc: 2, r: false },
    { t: "People would describe me as upbeat and full of energy.", fc: 3, r: false },
    { t: "I rarely feel bursts of excitement or enthusiasm.", fc: 3, r: true },
  ],
  A: [
    { t: "Once someone has wronged me, I find it hard to ever trust them again.", fc: 0, r: true },
    { t: "I can warm back up to people who treated me badly, once they make a real effort.", fc: 0, r: false },
    { t: "When judging other people, I tend to be lenient.", fc: 1, r: false },
    { t: "I'm quick to point out other people's flaws.", fc: 1, r: true },
    { t: "People say I go easy on others, even when criticism might be deserved.", fc: 1, r: false },
    { t: "When people disagree with me, I dig in rather than compromise.", fc: 2, r: true },
    { t: "I'd rather give some ground in an argument than let it turn into a fight.", fc: 2, r: false },
    { t: "It takes a lot to make me lose my temper.", fc: 3, r: false },
    { t: "I get irritated quickly when people annoy me.", fc: 3, r: true },
    { t: "Even when someone is rude to me, I stay even-keeled.", fc: 3, r: false },
  ],
  C: [
    { t: "My workspace and files are tidy and well ordered.", fc: 0, r: false },
    { t: "I often lose time hunting for things I've misplaced.", fc: 0, r: true },
    { t: "I push myself hard toward my goals, even when no one is checking.", fc: 1, r: false },
    { t: "I do just enough work to get by.", fc: 1, r: true },
    { t: "When a job is worth doing, I put in more effort than is strictly required.", fc: 1, r: false },
    { t: "I double-check my work for small errors that others might not even notice.", fc: 2, r: false },
    { t: "Minor mistakes in my work don't bother me much.", fc: 2, r: true },
    { t: "I think through the consequences carefully before I act.", fc: 3, r: false },
    { t: "I often act on impulse and regret it later.", fc: 3, r: true },
    { t: "People consider me careful and deliberate rather than rash.", fc: 3, r: false },
  ],
  O: [
    { t: "I can be moved deeply by a painting, a song, or a landscape.", fc: 0, r: false },
    { t: "Spending time on art or music seems like a waste to me.", fc: 0, r: true },
    { t: "I love learning how things work, even when it's of no practical use.", fc: 1, r: false },
    { t: "Documentaries about science, history, or other cultures bore me.", fc: 1, r: true },
    { t: "I often go down rabbit holes reading about topics that catch my curiosity.", fc: 1, r: false },
    { t: "I enjoy inventing things of my own — ideas, stories, recipes, solutions.", fc: 2, r: false },
    { t: "I'd rather follow a proven method than experiment with a new one.", fc: 2, r: true },
    { t: "I enjoy people whose views are unusual or radical.", fc: 3, r: false },
    { t: "I find eccentric people more tiresome than interesting.", fc: 3, r: true },
    { t: "I like ideas that challenge conventional ways of thinking.", fc: 3, r: false },
  ],
};

/* Presentation order interleaves factors (H,E,X,A,C,O, H,E,X,...) like the original instrument. */
const ITEMS = [];
for (let k = 0; k < 10; k++) {
  for (const f of FACTOR_KEYS) {
    const it = BANK[f][k];
    ITEMS.push({ id: ITEMS.length + 1, f, fc: it.fc, r: it.r, t: it.t });
  }
}

const PAGE_SIZE = 10;
const N_PAGES = ITEMS.length / PAGE_SIZE;
const STORE_KEY = "ha60-v1";

/* ---------- state ---------- */
let state = { view: "intro", page: 0, name: "", answers: {} };
try {
  const saved = JSON.parse(localStorage.getItem(STORE_KEY));
  if (saved && saved.answers) state = Object.assign(state, saved, { view: "intro" });
} catch (e) { /* fresh start */ }

function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify({ page: state.page, name: state.name, answers: state.answers })); }
  catch (e) { /* private mode etc. */ }
}
function answeredCount() { return Object.keys(state.answers).length; }

/* ---------- scoring ---------- */
function computeScores() {
  const out = {};
  for (const f of FACTOR_KEYS) {
    const facetVals = [[], [], [], []];
    for (const it of ITEMS) {
      if (it.f !== f) continue;
      const raw = state.answers[it.id];
      const v = it.r ? 6 - raw : raw;
      facetVals[it.fc].push(v);
    }
    const mean = a => a.reduce((s, x) => s + x, 0) / a.length;
    const facets = facetVals.map(mean);
    const all = facetVals.flat();
    out[f] = { score: mean(all), facets };
  }
  return out;
}
function band(score) { return score < 2.5 ? "low" : score <= 3.5 ? "mid" : "high"; }
function bandLabel(score) { return { low: "Lower range", mid: "Mid-range", high: "Higher range" }[band(score)]; }
function fmt(x) { return x.toFixed(1); }
function pct(score) { return ((score - 1) / 4 * 100).toFixed(1) + "%"; }

/* ---------- rendering ---------- */
const app = document.getElementById("app");
function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }

function render() {
  if (state.view === "intro") renderIntro();
  else if (state.view === "quiz") renderQuiz();
  else renderResults();
  window.scrollTo(0, 0);
}

function renderIntro() {
  const resumable = answeredCount() > 0 && answeredCount() < ITEMS.length;
  const complete = answeredCount() === ITEMS.length;
  app.innerHTML = `
    <div class="card">
      <h1>HA-60 Personality Inventory</h1>
      <p class="sub">An unofficial, original-item analog of the HEXACO model of personality — for personal, educational use.</p>
      <p>You'll read 60 statements and rate how much you agree with each on a five-point scale.
         There are no right or wrong answers, and nothing leaves your browser — answers are stored
         only on this device. It takes about 10 minutes.</p>
      <p>You'll get scores on six broad factors — <strong>H</strong>onesty-Humility, <strong>E</strong>motionality,
         e<strong>X</strong>traversion, <strong>A</strong>greeableness, <strong>C</strong>onscientiousness, and
         <strong>O</strong>penness to Experience — each with four narrower facets, plus a downloadable report card.</p>
      <p><label for="nm"><strong>Your name</strong> (optional — appears on the report card):</label><br>
         <input type="text" id="nm" maxlength="60" value="${esc(state.name)}" placeholder="e.g. Aric"></p>
      <div class="btnrow">
        <button class="btn primary" id="start">${resumable ? "Resume (" + answeredCount() + "/60 answered)" : "Start"}</button>
        ${complete ? '<button class="btn" id="see-results">See my results</button>' : ""}
        ${answeredCount() > 0 ? '<button class="btn" id="reset">Start over</button>' : ""}
      </div>
    </div>
    <div class="card disclaimer">
      This is <strong>not</strong> the HEXACO-PI-R. The HEXACO-PI-R is a copyrighted instrument by
      Kibeom Lee and Michael C. Ashton (see hexaco.org). The items here are original text written to
      cover the same six factors and twenty-four facets described in the published HEXACO model.
      Scores are raw item averages with no population norms — treat them as a structured self-reflection
      exercise, not a validated assessment. Not for research, clinical, hiring, or any decision-making use.
    </div>`;
  document.getElementById("nm").addEventListener("input", e => { state.name = e.target.value; save(); });
  document.getElementById("start").onclick = () => { state.view = "quiz"; render(); };
  const sr = document.getElementById("see-results");
  if (sr) sr.onclick = () => { state.view = "results"; render(); };
  const rs = document.getElementById("reset");
  if (rs) rs.onclick = () => {
    if (confirm("Erase all saved answers and start over?")) {
      state.answers = {}; state.page = 0; save(); render();
    }
  };
}

function renderQuiz() {
  const start = state.page * PAGE_SIZE;
  const pageItems = ITEMS.slice(start, start + PAGE_SIZE);
  const isLast = state.page === N_PAGES - 1;
  app.innerHTML = `
    <div class="progress">
      <div class="meta">
        <span>Page ${state.page + 1} of ${N_PAGES}</span>
        <span id="pcount">${answeredCount()} / ${ITEMS.length} answered</span>
      </div>
      <div class="track"><div class="fill" id="pbar" style="width:${answeredCount() / ITEMS.length * 100}%"></div></div>
    </div>
    <div class="card">
      ${pageItems.map(it => `
        <fieldset class="item" id="item-${it.id}">
          <legend><span class="qnum">${it.id}.</span>${esc(it.t)}</legend>
          <div class="opts">
            ${SCALE.map(([v, label]) => `
              <label><input type="radio" name="q${it.id}" value="${v}"
                ${state.answers[it.id] === v ? "checked" : ""}><span>${label}</span></label>`).join("")}
          </div>
        </fieldset>`).join("")}
      <div class="btnrow">
        <button class="btn" id="back">${state.page === 0 ? "Intro" : "Back"}</button>
        <button class="btn primary" id="next">${isLast ? "See my results" : "Next"}</button>
      </div>
    </div>`;
  app.querySelectorAll("input[type=radio]").forEach(inp => {
    inp.addEventListener("change", () => {
      const id = +inp.name.slice(1);
      state.answers[id] = +inp.value;
      save();
      document.getElementById("item-" + id).classList.remove("missing");
      document.getElementById("pcount").textContent = answeredCount() + " / " + ITEMS.length + " answered";
      document.getElementById("pbar").style.width = answeredCount() / ITEMS.length * 100 + "%";
    });
  });
  document.getElementById("back").onclick = () => {
    if (state.page === 0) { state.view = "intro"; } else { state.page--; }
    save(); render();
  };
  document.getElementById("next").onclick = () => {
    const missing = pageItems.filter(it => !state.answers[it.id]);
    if (missing.length) {
      pageItems.forEach(it => document.getElementById("item-" + it.id)
        .classList.toggle("missing", !state.answers[it.id]));
      document.getElementById("item-" + missing[0].id).scrollIntoView({ behavior: "smooth", block: "center" });
      return;
    }
    if (isLast) { state.view = "results"; } else { state.page++; }
    save(); render();
  };
}

/* ---------- radar (SVG, on screen) ---------- */
function radarVertex(i, value, cx, cy, r) {
  const ang = -Math.PI / 2 + i * Math.PI / 3;
  const rr = (value - 1) / 4 * r;
  return [cx + rr * Math.cos(ang), cy + rr * Math.sin(ang)];
}
const measureCtx = document.createElement("canvas").getContext("2d");
function textW(text, font) { measureCtx.font = font; return measureCtx.measureText(text).width; }
/* Clamp a label's x so the rendered text stays inside [minX, maxX]. */
function clampLabelX(lx, anchor, w, minX, maxX) {
  if (anchor === "end" || anchor === "right") return Math.max(lx, minX + w);
  if (anchor === "start" || anchor === "left") return Math.min(lx, maxX - w);
  return Math.min(Math.max(lx, minX + w / 2), maxX - w / 2);
}
function radarSVG(scores) {
  const W = 520, H = 400, cx = W / 2, cy = H / 2 + 4, R = 130;
  const ringPoly = v => FACTOR_KEYS.map((_, i) => radarVertex(i, v, cx, cy, R).map(n => n.toFixed(1)).join(",")).join(" ");
  const rings = [2, 3, 4, 5].map(v =>
    `<polygon points="${ringPoly(v)}" fill="none" stroke="var(--grid)" stroke-width="1"/>`).join("");
  const spokes = FACTOR_KEYS.map((_, i) => {
    const [x, y] = radarVertex(i, 5, cx, cy, R);
    return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--grid)" stroke-width="1"/>`;
  }).join("");
  const dataPts = FACTOR_KEYS.map((f, i) => radarVertex(i, scores[f].score, cx, cy, R));
  const poly = dataPts.map(p => p.map(n => n.toFixed(1)).join(",")).join(" ");
  const dots = dataPts.map(([x, y], i) => {
    const f = FACTOR_KEYS[i];
    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.5" fill="var(--accent)"
      stroke="var(--surface)" stroke-width="2"><title>${FACTORS[f].name}: ${fmt(scores[f].score)} / 5</title></circle>`;
  }).join("");
  const labels = FACTOR_KEYS.map((f, i) => {
    const ang = -Math.PI / 2 + i * Math.PI / 3;
    let lx = cx + (R + 24) * Math.cos(ang);
    const ly = cy + (R + 24) * Math.sin(ang);
    const anchor = Math.abs(Math.cos(ang)) < 0.3 ? "middle" : (Math.cos(ang) > 0 ? "start" : "end");
    const label = FACTORS[f].name.replace("Openness to Experience", "Openness");
    lx = clampLabelX(lx, anchor, textW(label, "600 13px " + FONT), 4, W - 4);
    return `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="${anchor}" dominant-baseline="middle"
      font-size="13" font-weight="600" fill="var(--ink)">${label}</text>
      <text x="${lx.toFixed(1)}" y="${(ly + 16).toFixed(1)}" text-anchor="${anchor}" dominant-baseline="middle"
      font-size="12" fill="var(--muted)">${fmt(scores[f].score)}</text>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img"
      aria-label="Radar chart of six HEXACO factor scores">
    ${rings}${spokes}
    <polygon points="${poly}" fill="var(--accent-wash)" stroke="var(--accent)"
      stroke-width="2" stroke-linejoin="round"/>
    ${dots}${labels}
  </svg>`;
}

function renderResults() {
  if (answeredCount() < ITEMS.length) { state.view = "quiz"; render(); return; }
  const scores = computeScores();
  app.innerHTML = `
    <div class="card">
      <h1>Your HA-60 profile</h1>
      <p class="sub">${state.name ? esc(state.name) + " · " : ""}${new Date().toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" })}
        · Scores are averages on a 1–5 scale (no population norms).</p>
      <div class="results-grid">
        <div class="radar-card">${radarSVG(scores)}</div>
        <div class="score-list">
          ${FACTOR_KEYS.map(f => `
            <div class="score-row" title="${FACTORS[f].name}: ${fmt(scores[f].score)} / 5">
              <span class="name">${FACTORS[f].name}<span class="band">${bandLabel(scores[f].score)}</span></span>
              <div class="bar"><div class="fill" style="width:${pct(scores[f].score)}"></div></div>
              <span class="val">${fmt(scores[f].score)}</span>
            </div>`).join("")}
        </div>
      </div>
      <div class="btnrow">
        <button class="btn primary" id="dl">Download report card (PNG)</button>
        <button class="btn" id="review">Review answers</button>
        <button class="btn" id="restart">Start over</button>
      </div>
    </div>
    ${FACTOR_KEYS.map(f => `
      <div class="card factor-card">
        <h2>${FACTORS[f].name} <span class="fscore">${fmt(scores[f].score)} / 5 · ${bandLabel(scores[f].score)}</span></h2>
        <p>${FACTORS[f][band(scores[f].score)]}</p>
        ${FACTORS[f].facets.map((fx, i) => `
          <div class="facet-row" title="${fx}: ${fmt(scores[f].facets[i])} / 5">
            <span class="fname">${fx}</span>
            <div class="bar"><div class="fill" style="width:${pct(scores[f].facets[i])}"></div></div>
            <span class="fval">${fmt(scores[f].facets[i])}</span>
          </div>`).join("")}
      </div>`).join("")}
    <div class="card disclaimer">
      HA-60 is an unofficial, original-item analog of the HEXACO personality model, built for personal
      educational use. It is not the HEXACO-PI-R (© K. Lee &amp; M. C. Ashton, hexaco.org) and has no
      established reliability, validity, or norms. Bands: below 2.5 = lower range, 2.5–3.5 = mid-range,
      above 3.5 = higher range, relative to the scale midpoint of 3.
    </div>`;
  document.getElementById("dl").onclick = () => downloadReport(scores);
  document.getElementById("review").onclick = () => { state.view = "quiz"; state.page = 0; save(); render(); };
  document.getElementById("restart").onclick = () => {
    if (confirm("Erase all saved answers and start over?")) {
      state.answers = {}; state.page = 0; state.view = "intro"; save(); render();
    }
  };
}

/* ---------- report card (canvas → PNG, always on the light theme) ---------- */
const RC = {  // report-card palette (fixed light theme so the export is deterministic)
  surface: "#fcfcfb", ink: "#0b0b0b", ink2: "#52514e", muted: "#898781",
  grid: "#e1e0d9", accent: "#2a78d6", accentSoft: "#cde2fb", accentWash: "rgba(42,120,214,0.10)",
};
const FONT = 'system-ui, -apple-system, "Segoe UI", sans-serif';

function wrapText(ctx, text, x, y, maxW, lineH) {
  const words = text.split(" ");
  let line = "";
  for (const w of words) {
    const test = line ? line + " " + w : w;
    if (ctx.measureText(test).width > maxW && line) {
      ctx.fillText(line, x, y); y += lineH; line = w;
    } else line = test;
  }
  if (line) ctx.fillText(line, x, y);
  return y + lineH;
}

function roundedBarPath(ctx, x, y, w, h, r) {
  // square at the baseline (left), 4px rounded data end (right)
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x, y + h);
  ctx.closePath();
}
function drawScoreBar(ctx, x, y, w, h, score) {
  ctx.fillStyle = RC.accentSoft;
  roundedBarPath(ctx, x, y, w, h, Math.min(4, h / 2)); ctx.fill();
  const fw = (score - 1) / 4 * w;
  if (fw > 1) {
    ctx.fillStyle = RC.accent;
    roundedBarPath(ctx, x, y, fw, h, Math.min(4, h / 2)); ctx.fill();
  }
}

function drawRadarCanvas(ctx, scores, cx, cy, R) {
  ctx.strokeStyle = RC.grid; ctx.lineWidth = 1;
  for (const v of [2, 3, 4, 5]) {
    ctx.beginPath();
    FACTOR_KEYS.forEach((_, i) => {
      const [x, y] = radarVertex(i, v, cx, cy, R);
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.closePath(); ctx.stroke();
  }
  FACTOR_KEYS.forEach((_, i) => {
    const [x, y] = radarVertex(i, 5, cx, cy, R);
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(x, y); ctx.stroke();
  });
  const pts = FACTOR_KEYS.map((f, i) => radarVertex(i, scores[f].score, cx, cy, R));
  ctx.beginPath();
  pts.forEach(([x, y], i) => i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y));
  ctx.closePath();
  ctx.fillStyle = RC.accentWash; ctx.fill();
  ctx.strokeStyle = RC.accent; ctx.lineWidth = 2; ctx.lineJoin = "round"; ctx.stroke();
  for (const [x, y] of pts) {
    ctx.beginPath(); ctx.arc(x, y, 4.5, 0, Math.PI * 2);
    ctx.fillStyle = RC.accent; ctx.fill();
    ctx.strokeStyle = RC.surface; ctx.lineWidth = 2; ctx.stroke();
  }
  FACTOR_KEYS.forEach((f, i) => {
    const ang = -Math.PI / 2 + i * Math.PI / 3;
    const ly = cy + (R + 28) * Math.sin(ang);
    let lx = cx + (R + 28) * Math.cos(ang);
    const align = Math.abs(Math.cos(ang)) < 0.3 ? "center" : (Math.cos(ang) > 0 ? "left" : "right");
    const label = FACTORS[f].name.replace("Openness to Experience", "Openness");
    lx = clampLabelX(lx, align, textW(label, "600 14px " + FONT), 16, 570);
    ctx.textAlign = align; ctx.textBaseline = "middle";
    ctx.font = "600 14px " + FONT; ctx.fillStyle = RC.ink;
    ctx.fillText(label, lx, ly);
    ctx.font = "13px " + FONT; ctx.fillStyle = RC.muted;
    ctx.fillText(fmt(scores[f].score), lx, ly + 17);
  });
  ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
}

function drawReport(scores) {
  const W = 1200, H = 1380, S = 2;
  const canvas = document.createElement("canvas");
  canvas.width = W * S; canvas.height = H * S;
  const ctx = canvas.getContext("2d");
  ctx.scale(S, S);
  ctx.fillStyle = RC.surface; ctx.fillRect(0, 0, W, H);
  const M = 64;

  // header
  ctx.fillStyle = RC.ink; ctx.font = "700 30px " + FONT;
  ctx.fillText("HA-60 Personality Profile", M, 66);
  ctx.fillStyle = RC.ink2; ctx.font = "15px " + FONT;
  ctx.fillText("HEXACO-model inventory · unofficial analog for personal educational use", M, 92);
  const dateStr = new Date().toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" });
  ctx.textAlign = "right";
  ctx.fillStyle = RC.ink; ctx.font = "600 16px " + FONT;
  if (state.name) ctx.fillText(state.name, W - M, 66);
  ctx.fillStyle = RC.muted; ctx.font = "14px " + FONT;
  ctx.fillText(dateStr, W - M, state.name ? 88 : 66);
  ctx.textAlign = "left";
  ctx.strokeStyle = RC.grid; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(M, 116); ctx.lineTo(W - M, 116); ctx.stroke();

  // radar (left) + factor bars (right)
  drawRadarCanvas(ctx, scores, 300, 350, 150);
  const bx = 620;
  FACTOR_KEYS.forEach((f, i) => {
    const y = 176 + i * 62;
    ctx.fillStyle = RC.ink; ctx.font = "600 15px " + FONT;
    ctx.fillText(FACTORS[f].name, bx, y);
    ctx.textAlign = "right";
    ctx.font = "600 15px " + FONT;
    ctx.fillText(fmt(scores[f].score), W - M, y);
    ctx.textAlign = "left";
    ctx.fillStyle = RC.muted; ctx.font = "12.5px " + FONT;
    ctx.fillText(bandLabel(scores[f].score), bx, y + 38);
    drawScoreBar(ctx, bx, y + 8, W - M - bx, 14, scores[f].score);
  });

  // facets — 3 columns × 2 rows
  let y0 = 570;
  ctx.fillStyle = RC.ink; ctx.font = "700 18px " + FONT;
  ctx.fillText("Facet scores", M, y0);
  y0 += 20;
  const colW = (W - 2 * M - 2 * 40) / 3;
  FACTOR_KEYS.forEach((f, i) => {
    const col = i % 3, row = Math.floor(i / 3);
    const x = M + col * (colW + 40), y = y0 + row * 190;
    ctx.fillStyle = RC.ink; ctx.font = "600 15px " + FONT;
    ctx.fillText(FACTORS[f].name, x, y + 18);
    FACTORS[f].facets.forEach((fx, j) => {
      const fy = y + 44 + j * 32;
      ctx.fillStyle = RC.ink2; ctx.font = "13px " + FONT;
      ctx.fillText(fx, x, fy);
      drawScoreBar(ctx, x + 150, fy - 10, colW - 150 - 40, 10, scores[f].facets[j]);
      ctx.fillStyle = RC.ink; ctx.font = "600 13px " + FONT;
      ctx.textAlign = "right";
      ctx.fillText(fmt(scores[f].facets[j]), x + colW, fy);
      ctx.textAlign = "left";
    });
  });

  // interpretations
  let iy = y0 + 2 * 190 + 26;
  ctx.fillStyle = RC.ink; ctx.font = "700 18px " + FONT;
  ctx.fillText("What the scores suggest", M, iy);
  iy += 28;
  const icolW = (W - 2 * M - 48) / 2;
  const colY = [iy, iy];
  FACTOR_KEYS.forEach((f, i) => {
    const col = i % 2;
    const x = M + col * (icolW + 48);
    let yy = colY[col];
    ctx.fillStyle = RC.ink; ctx.font = "600 14.5px " + FONT;
    ctx.fillText(FACTORS[f].name + " — " + fmt(scores[f].score) + " (" + bandLabel(scores[f].score).toLowerCase() + ")", x, yy);
    yy += 21;
    ctx.fillStyle = RC.ink2; ctx.font = "13.5px " + FONT;
    yy = wrapText(ctx, FACTORS[f][band(scores[f].score)], x, yy, icolW, 19);
    colY[col] = yy + 14;
  });

  // footer
  const fy = H - 74;
  ctx.strokeStyle = RC.grid;
  ctx.beginPath(); ctx.moveTo(M, fy); ctx.lineTo(W - M, fy); ctx.stroke();
  ctx.fillStyle = RC.muted; ctx.font = "11.5px " + FONT;
  wrapText(ctx,
    "HA-60 is an unofficial, original-item analog of the HEXACO personality model, for personal educational use only. " +
    "It is not the HEXACO-PI-R (© K. Lee & M. C. Ashton, hexaco.org) and has no established reliability, validity, or norms. " +
    "Scores are raw item averages on a 1–5 scale. Not for research, clinical, hiring, or decision-making use.",
    M, fy + 24, W - 2 * M, 17);
  return canvas;
}

function downloadReport(scores) {
  const canvas = drawReport(scores);
  const a = document.createElement("a");
  const d = new Date();
  const stamp = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  a.download = "ha60-report-" + stamp + ".png";
  a.href = canvas.toDataURL("image/png");
  a.click();
}

render();

/* Small console hook for scripted testing: HA60.computeScores(), HA60.drawReport(scores). */
window.HA60 = { drawReport, computeScores, get state() { return state; } };
</script>
